<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Ethan Stasse</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="head-btn">Ethan Stasse</a>
      <nav>
        <a href="contact.html" class="head-btn">contact</a>
      </nav>
    </header>
    <main class="contact-main">
      <h1>Contact</h1>
      <form
        action="verify.php"
        method="POST"
        class="contact-form"
        id="contact-form"
      >
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <div
          class="g-recaptcha"
          data-sitekey="6LdvhtMtAAAAADu4C-uQkac27B-eRGXY-VKt0NkW"
        ></div>

        <button type="submit">Envoyer</button>
        <p id="form-status" role="status"></p>
      </form>

      <script>
        const form = document.getElementById("contact-form");
        const statusEl = document.getElementById("form-status");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          if (!grecaptcha.getResponse()) {
            statusEl.textContent = "Coche la case « Je ne suis pas un robot ».";
            return;
          }

          statusEl.textContent = "Envoi en cours...";

          try {
            const response = await fetch(form.action, {
              method: "POST",
              body: new FormData(form),
            });

            if (response.ok) {
              statusEl.textContent = "Message envoyé, merci !";
              form.reset();
            } else if (response.status === 403) {
              statusEl.textContent = "Captcha invalide, réessaie.";
            } else {
              statusEl.textContent = "Erreur, réessaie plus tard.";
            }
          } catch {
            statusEl.textContent = "Problème de connexion, réessaie plus tard.";
          }

          grecaptcha.reset();
        });
      </script>
    </main>
  </body>
</html>
